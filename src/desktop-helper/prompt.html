<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 16px;
        font: 13px system-ui, sans-serif;
        background: #1f2329;
        color: #f2f3f5;
      }
      h3 {
        margin: 0 0 10px;
        font-size: 14px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #4a5058;
        background: #2b3038;
        color: #f2f3f5;
      }
      .row {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 14px;
      }
      button {
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid #4a5058;
        background: #2b3038;
        color: #f2f3f5;
        cursor: pointer;
      }
      button.primary {
        background: #4f8cff;
        border-color: #4f8cff;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h3>隐藏时长（分钟）</h3>
    <input id="minutes" type="number" min="1" max="1440" value="15" />
    <div class="row">
      <button id="cancel">取消</button>
      <button id="ok" class="primary">隐藏</button>
    </div>
    <script>
      const input = document.getElementById('minutes');
      document.getElementById('ok').addEventListener('click', () => {
        const value = Number(input.value);
        if (Number.isFinite(value) && value > 0 && value <= 1440) {
          window.hexDesktop.submitHide(value);
        }
      });
      document.getElementById('cancel').addEventListener('click', () => window.close());
      input.focus();
    </script>
  </body>
</html>
